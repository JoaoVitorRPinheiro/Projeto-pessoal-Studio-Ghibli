<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Ghibli | Cadastro</title>
    <link rel="stylesheet" href="ghibli.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">

        <section>
            <p class="frase">A vida é uma luz <br> que pisca na escuridão</p>

            <nav>
                <p><a href="index.html">Home</a></p>
                <p><a href="index.html#sobre">O Studio</a></p>
                <p><a href="index.html#porque">Por que escolhi</a></p>
                <p><a href="index.html#como">Como me mudou</a></p>
                <p><a href="index.html#cenas">Cenas</a></p>
            </nav>

            <div class="botoes">
                <a href="login.html" class="botao">Login</a>
                <a href="cadastro.html" class="botao">Cadastro</a>
            </div>
        </section>

    </header>

    <div class="petalas">
        <span class="petala" style="left: 8%; animation-duration: 12s; animation-delay: -3s;"></span>
        <span class="petala" style="left: 25%; animation-duration: 15s; animation-delay: -8s;"></span>
        <span class="petala" style="left: 46%; animation-duration: 11s; animation-delay: -5s;"></span>
        <span class="petala" style="left: 63%; animation-duration: 14s; animation-delay: -1s;"></span>
        <span class="petala" style="left: 80%; animation-duration: 12s; animation-delay: -9s;"></span>
        <span class="petala" style="left: 93%; animation-duration: 16s; animation-delay: -6s;"></span>
    </div>

    <div class="cartao invertido">
        <div class="imagem imagem-cadastro">
            
        </div>

        <div class="formulario">
            <h2>Crie sua conta</h2>
            <p class="subtitulo">Registre as suas sessões e acompanhe a sua jornada pelos filmes do estúdio.</p>

            <span class="input_div">Nome</span>
            <input id="nome_input" type="text" placeholder="Seu nome">

            <span class="input_div">E-mail</span>
            <input id="email_input" type="text" placeholder="email@exemplo.com">

            <span class="input_div">Senha</span>
            <input id="senha_input" type="password" placeholder="Mínimo de 6 caracteres">

            <span class="input_div">Confirmar senha</span>
            <input id="confirmacao_input" type="password" placeholder="Repita a senha">

            <button onclick="cadastrar()">Cadastrar</button>

            <div class="mensagem" id="mensagem"></div>

            <p class="link">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>

    <img class="personagem" src="assets/totoro azul escuro.svg" alt="Totoro">

    <script>
        function cadastrar() {
            let nomeVar = nome_input.value;
            let emailVar = email_input.value;
            let senhaVar = senha_input.value;
            let confirmacaoVar = confirmacao_input.value;

            let campos = [nomeVar, emailVar, senhaVar, confirmacaoVar];
            let vazios = 0;

            for (let i = 0; i < campos.length; i++) {
                if (campos[i] == "") {
                    vazios = vazios + 1;
                }
            }

            if (vazios > 0) {
                mensagem.innerHTML = "Preencha todos os campos.";
            } else if (senhaVar.length < 6) {
                mensagem.innerHTML = "A senha precisa ter pelo menos 6 caracteres.";
            } else if (senhaVar != confirmacaoVar) {
                mensagem.innerHTML = "As senhas não são iguais.";
            } else {
                mensagem.innerHTML = "Cadastrando...";

                fetch("/usuarios/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nomeServer: nomeVar,
                        emailServer: emailVar,
                        senhaServer: senhaVar
                    })
                }).then(function (resposta) {
                    if (resposta.ok) {
                        mensagem.innerHTML = "Cadastro feito! Indo para o login...";

                        setTimeout(function () {
                            window.location = "login.html";
                        }, 2000);
                    } else {
                        resposta.text().then(function (texto) {
                            mensagem.innerHTML = texto;
                        });
                    }
                }).catch(function (erro) {
                    console.log(erro);
                    mensagem.innerHTML = "Não consegui falar com a API. Ela está ligada?";
                });
            }
        }
    </script>

</body>

</html>
